# Inspiratie voor de digital garden van Norwin

Dit is een voorbeeld. Pas alles aan, zet het naar je hand, doe dingen...

---

# Agenda


1. interactief ontdekkingsplatform over bijzondere verschijnselen, optische illusies, kansberekening en psychologische experimenten
2. 10 links
3. 50 afbeeldingen
4. ...(max 11 slides, 15 totaal)
5. introtekst van max. 180 tekens

---

# Onderwerp

Ik ben geïnteresseerd in bijzondere verschijnselen, bizarre kansen en de werking van het menselijk brein. Vooral wanneer iets anders blijkt te werken dan je op het eerste gezicht verwacht, bijvoorbeeld bij cognitive biases of optische illusies. Ik wil dit uitleggen via interactieve experimenten met bijvoorbeeld optische illusies en kanssimulaties. Door het als een spel of simulatie te ervaren zal het sneller en leuker worden begrepen.
